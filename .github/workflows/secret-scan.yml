name: Secret scan

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  # gitleaks-action only scans a diff range on push, and a root commit has no
  # parent to diff against. Scheduled and manual runs scan the whole history.
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

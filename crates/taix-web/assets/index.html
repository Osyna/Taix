<!doctype html>
<html lang="en" data-view="home">
  <head>
    <meta charset="utf-8" />
    <!-- The page never zooms - the terminal does, by its own pinch. Safari
         ignores `user-scalable`, so `touch-action` and the gesture handlers
         in `app.js` do the actual work; this is for everyone else.
         `interactive-widget=resizes-content` is what keeps a phone's soft
         keyboard from covering the pane it is typing into. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0b0f12" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>TaiX</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="booting">
    <div id="glow" aria-hidden="true"></div>

    <!-- One sprite, no icon requests. `sym(name)` in store.js references
         these; harness icons still come from /icons/<name>.svg. -->
    <svg id="sprite" aria-hidden="true">
      <symbol id="i-grid" viewBox="0 0 16 16">
        <rect x="2" y="2" width="5" height="5" rx="1.5" /><rect x="9" y="2" width="5" height="5" rx="1.5" />
        <rect x="2" y="9" width="5" height="5" rx="1.5" /><rect x="9" y="9" width="5" height="5" rx="1.5" />
      </symbol>
      <symbol id="i-term" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <path d="M3 4l3.2 3.2L3 10.4" /><path d="M8.6 11.5h4.6" />
      </symbol>
      <symbol id="i-folder" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
        <path d="M2 4.6a1.2 1.2 0 011.2-1.2h2.6l1.3 1.6h5.7A1.2 1.2 0 0114 6.2v5.4a1.2 1.2 0 01-1.2 1.2H3.2A1.2 1.2 0 012 11.6z" />
      </symbol>
      <symbol id="i-git" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
        <circle cx="4.2" cy="3.6" r="1.8" /><circle cx="4.2" cy="12.4" r="1.8" /><circle cx="11.8" cy="6.4" r="1.8" />
        <path d="M4.2 5.4v5.2M5.9 5.1c2.4 0 4 .6 4 2.6 0 1.8-1.7 2.6-4.2 2.9" />
      </symbol>
      <symbol id="i-chart" viewBox="0 0 16 16">
        <rect x="2" y="9" width="2.6" height="5" rx="1" /><rect x="6.7" y="5" width="2.6" height="9" rx="1" />
        <rect x="11.4" y="2" width="2.6" height="12" rx="1" />
      </symbol>
      <symbol id="i-gear" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
        <circle cx="8" cy="8" r="2.3" />
        <path d="M8 1.6v1.7M8 12.7v1.7M14.4 8h-1.7M3.3 8H1.6M12.5 3.5l-1.2 1.2M4.7 11.3l-1.2 1.2M12.5 12.5l-1.2-1.2M4.7 4.7L3.5 3.5" />
      </symbol>
      <symbol id="i-search" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
        <circle cx="7" cy="7" r="4.6" /><path d="M10.6 10.6L14 14" stroke-linecap="round" />
      </symbol>
      <symbol id="i-plus" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <path d="M8 3.4v9.2M3.4 8h9.2" />
      </symbol>
      <symbol id="i-back" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9.8 3.5L5.3 8l4.5 4.5" />
      </symbol>
      <symbol id="i-more" viewBox="0 0 16 16"><circle cx="3.4" cy="8" r="1.25" /><circle cx="8" cy="8" r="1.25" /><circle cx="12.6" cy="8" r="1.25" /></symbol>
      <symbol id="i-close" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <path d="M4.2 4.2l7.6 7.6M11.8 4.2l-7.6 7.6" />
      </symbol>
      <symbol id="i-zoom" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
        <path d="M9.4 2.6H13.4V6.6M6.6 13.4H2.6V9.4M13.4 2.6l-4.3 4.3M2.6 13.4l4.3-4.3" />
      </symbol>
      <symbol id="i-copy" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
        <rect x="5.6" y="5.6" width="8" height="8" rx="1.6" /><path d="M10.4 3.2H3.9c-.7 0-1.3.6-1.3 1.3v6.5" />
      </symbol>
      <symbol id="i-send" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 13V3.4M3.9 7.5L8 3.4l4.1 4.1" />
      </symbol>
      <symbol id="i-bell" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
        <path d="M4.2 11.2V7.3a3.8 3.8 0 117.6 0v3.9l1 1.3H3.2z" /><path d="M6.6 13.6a1.5 1.5 0 002.8 0" />
      </symbol>
      <symbol id="i-play" viewBox="0 0 16 16"><path d="M5 3.4l7.4 4.6L5 12.6z" /></symbol>
    </svg>

    <header id="top">
      <button id="nav" class="icon" aria-label="Back"><span class="bars"></span></button>
      <div id="brand">
        <span id="mark" aria-hidden="true">T</span>
        <div id="brand-text">
          <b>TaiX</b>
          <span id="host" class="mono"></span>
        </div>
      </div>

      <!-- The mobile stage title: window name over "project · state". On a
           laptop this is the breadcrumb between the wordmark and search. -->
      <div id="crumb">
        <b id="crumb-name"></b>
        <span id="crumb-sub" class="mono"></span>
      </div>

      <button id="omni" type="button" aria-label="Search">
        <svg class="ico" aria-hidden="true"><use href="#i-search" /></svg>
        <span id="omni-text">Jump to a terminal, project, or command…</span>
        <kbd class="mono">⌘K</kbd>
      </button>

      <div id="notice" class="mono" role="status"></div>
      <button id="attn" class="chip attn" hidden><span class="dot"></span><span id="attn-text"></span></button>
      <span id="facts-top" class="chip mono"></span>
      <button id="more" class="icon" aria-label="This window"><svg class="ico"><use href="#i-more" /></svg></button>
      <button id="add" class="accent"><span class="add-label">New window</span></button>
    </header>

    <div id="body">
      <!-- The section rail: the same five places the phone's dock has, in
           the same order, so the two layouts never disagree about where
           anything lives. -->
      <nav id="rail" aria-label="Sections">
        <button data-go="home" title="Projects"><svg class="ico"><use href="#i-grid" /></svg></button>
        <button data-go="stage" title="Terminal"><svg class="ico"><use href="#i-term" /></svg></button>
        <button data-go="files" title="Files"><svg class="ico"><use href="#i-folder" /></svg></button>
        <button data-go="git" title="Source control"><svg class="ico"><use href="#i-git" /></svg></button>
        <button data-go="jobs" title="Automation"><svg class="ico"><use href="#i-chart" /></svg></button>
        <span class="grow"></span>
        <button data-go="settings" title="Settings"><svg class="ico"><use href="#i-gear" /></svg></button>
      </nav>

      <aside id="side" aria-label="Projects">
        <div id="side-top">
          <label id="side-search">
            <svg class="ico" aria-hidden="true"><use href="#i-search" /></svg>
            <input id="filter" type="search" placeholder="Filter projects &amp; terminals" autocomplete="off" />
          </label>
          <button id="add-project" class="icon" title="Add project"><svg class="ico"><use href="#i-plus" /></svg></button>
        </div>
        <!-- Rendered by side.js: the attention card, then the filter
             chips. Both are page-local; the server knows nothing of them. -->
        <div id="home-top"></div>
        <div id="projects"></div>
      </aside>

      <main id="stage">
        <div id="stage-head">
          <div id="stage-title">
            <h1 id="stage-name"></h1>
            <span id="stage-badge" class="badge"></span>
          </div>
          <div id="stage-sub" class="mono"></div>
          <div id="layout" role="group" aria-label="Layout">
            <button data-layout="focus">Focus</button>
            <button data-layout="split">Split</button>
            <button data-layout="grid">Grid</button>
          </div>
        </div>

        <!-- The window switcher: tabs on a laptop, a strip of pills a
             thumb can reach on a phone, one renderer either way. -->
        <nav id="wins" aria-label="Windows"></nav>

        <div id="grid"></div>
        <div id="stage-empty" hidden>
          <p>No window here yet.</p>
          <button class="accent" data-act="new-terminal">Open a terminal</button>
        </div>
      </main>

      <aside id="panel" hidden aria-label="Panel">
        <header id="panel-top">
          <span id="panel-title"></span>
          <span class="grow"></span>
          <div id="panel-tools"></div>
          <button id="panel-close" class="icon" title="Close"><svg class="ico"><use href="#i-close" /></svg></button>
        </header>
        <div id="panel-body"></div>
      </aside>

      <!-- What the desktop keeps in its status bar, given room to be read:
           session, memory per window, git, jobs. Widest layouts only. -->
      <aside id="info" aria-label="Status"></aside>
    </div>

    <!-- Everything a thumb types with. One region, so the pane above it
         always knows exactly how much height it has left: a claim prompt,
         the answer card, the suggestion strip, the key rows, and the line.

         The line is staged here and sent whole. A terminal driven one
         keystroke at a time over a network echoes late, loses every
         argument with autocorrect, and gives the keyboard nothing to
         suggest against; a staged line is local, so it is instant. -->
    <div id="input" hidden>
      <div id="claim" hidden>
        <button id="claim-go" class="accent" type="button">Take control of this terminal</button>
        <button id="claim-read" class="ghost-btn" type="button">Just reading</button>
      </div>
      <!-- An agent asking a yes/no question, answered without typing. -->
      <div id="prompt" hidden></div>
      <div id="sugg" hidden aria-label="Recent commands"></div>
      <div id="keys" aria-label="Keys"></div>
      <form id="entry">
        <div id="entry-box">
          <span id="entry-mark" class="mono" aria-hidden="true">❯</span>
          <textarea
            id="entry-text"
            rows="1"
            placeholder="Type a command…"
            autocapitalize="off"
            autocorrect="off"
            autocomplete="off"
            spellcheck="false"
            enterkeyhint="send"
          ></textarea>
          <button id="entry-add" type="button" title="Add a photo or file" aria-label="Add a photo or file">
            <svg class="ico"><use href="#i-plus" /></svg>
          </button>
        </div>
        <button id="entry-send" class="accent" type="submit" title="Send this line" aria-label="Send">
          <svg class="ico"><use href="#i-send" /></svg>
        </button>
      </form>
      <!-- Two inputs, because `accept="image/*"` is what makes iOS offer the
           camera and hand over a JPEG instead of a HEIC no agent can read.
           The plain one takes anything, including a file from iCloud or
           Drive. -->
      <input id="pick-image" type="file" accept="image/*" multiple hidden />
      <input id="pick-file" type="file" multiple hidden />
    </div>

    <footer id="bar">
      <span id="bar-where" class="mono"></span>
      <button id="bar-web" class="chip" title="Open this page">
        <span class="dot"></span><span id="bar-web-text" class="mono"></span>
      </button>
      <span class="grow"></span>
      <span id="bar-facts" class="mono"></span>
    </footer>

    <nav id="dock" aria-label="Sections">
      <button data-go="home"><svg class="ico"><use href="#i-grid" /></svg><span>Projects</span></button>
      <button data-go="stage"><svg class="ico"><use href="#i-term" /></svg><span>Terminal</span></button>
      <button data-go="files"><svg class="ico"><use href="#i-folder" /></svg><span>Files</span></button>
      <button data-go="git"><svg class="ico"><use href="#i-git" /></svg><span>Git</span></button>
      <button data-go="more"><svg class="ico"><use href="#i-more" /></svg><span>More</span></button>
    </nav>

    <!-- The raw keystroke pipe, for a browser with a real keyboard: one
         nearly-transparent pixel that holds focus while `term.js` reads its
         `beforeinput` events and keeps it empty. A phone uses `#entry`
         instead - a hardware key arrives whole, a soft one does not. -->
    <textarea
      id="sink"
      tabindex="-1"
      autocapitalize="off"
      autocorrect="off"
      autocomplete="off"
      spellcheck="false"
      inputmode="text"
      enterkeyhint="enter"
    ></textarea>

    <div id="toasts" role="alert"></div>
    <div id="modal" hidden><div id="modal-card"></div></div>
    <div id="sheet" hidden><div id="sheet-card"></div></div>
    <div id="palette" hidden>
      <div id="palette-card">
        <label id="palette-top">
          <svg class="ico" aria-hidden="true"><use href="#i-search" /></svg>
          <input id="palette-input" type="text" placeholder="Jump to a terminal, project, or command…" autocomplete="off" spellcheck="false" />
        </label>
        <div id="palette-list"></div>
      </div>
    </div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>

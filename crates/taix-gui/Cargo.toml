[package]
name = "taix-gui"
version.workspace = true
edition.workspace = true
description = "GTK4/libadwaita front-end."

[features]
default = []
browser = ["dep:webkit6"]


[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
gtk = { version = "0.11.4", package = "gtk4", features = ["v4_12"] }
serde_json.workspace = true
taix-core.workspace = true
taix-git.workspace = true
taix-term.workspace = true
taix-tmux.workspace = true
taix-web.workspace = true
webkit6 = { version = "0.6.1", optional = true }

[[example]]
name = "headless_probe"
required-features = ["browser"]

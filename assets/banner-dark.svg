<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" role="img"
     aria-label="TaiX">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141418"/>
      <stop offset="100%" stop-color="#2a2140"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" filter="url(#grain)"/>
  <g font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace"
     text-anchor="middle">
    <text x="640" y="196" font-size="86" font-weight="700" fill="#f4f3f7"
          letter-spacing="-2">TaiX</text>
    <text x="640" y="248" font-size="24" font-weight="400" fill="#f4f3f7" opacity="0.72"
          letter-spacing="1">One tmux server, many coding agents, three front ends</text>
  </g>
</svg>
